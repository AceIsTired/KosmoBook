{% extends "base.html" %}

{% block content %}
<div class="container my-4">
    <h1>Edit Appointment</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-primary" type="submit">Save Changes</button>
        <a class="btn btn-secondary" href="javascript:history.back()">Cancel</a>
    </form>
</div>
{% endblock %}
