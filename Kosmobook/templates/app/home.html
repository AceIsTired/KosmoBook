{% extends 'base.html' %}

{% block title %}Home - Kosmobook{% endblock %}

{% block content %}
<!-- Header -->
<header class="bg-white shadow-sm border-b">
    <div class="max-w-7xl mx-auto px-6">
        <div class="flex justify-between items-center h-16">
            <!-- Logo -->
            <div class="shrink-0">
                <h1 class="text-xl font-bold text-purple-900">Kosmobook</h1>
            </div>

            <!-- Navigation Links -->
            <nav class="flex space-x-8">
                <a href="{% url 'home' %}" class="text-gray-900 hover:text-purple-600 px-3 py-2 text-sm font-medium border-b-2 border-purple-600">Home</a>
                <a href="#" class="text-gray-500 hover:text-purple-600 px-3 py-2 text-sm font-medium">Feed</a>
                <a href="#" class="text-gray-500 hover:text-purple-600 px-3 py-2 text-sm font-medium">Appointments</a>
                <a href="{% url 'users:profile' username=request.user.username %}" class="text-gray-500 hover:text-purple-600 px-3 py-2 text-sm font-medium">Profile</a>
            </nav>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md mx-8">
                <div class="relative">
                    <input 
                        type="text" 
                        placeholder="Search professionals, services..." 
                        class="w-full pl-4 pr-10 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    >
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- User Menu -->
            <div class="flex items-center space-x-4">
                <form method="post" action="{% url 'logout' %}" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-purple-700">
                        Logout
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="max-w-7xl mx-auto py-8 px-6">
    <div class="bg-white rounded-lg shadow-sm border p-8">
        <h2 class="text-2xl font-bold text-gray-900 mb-4">Welcome to your dashboard, {{ user.first_name }} </h2>
        <p class="text-gray-600">This is your home page. Content will go here.</p>
    </div>
</main>
{% endblock %}
