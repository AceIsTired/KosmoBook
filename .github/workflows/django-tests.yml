name: Django CI (feature branch)

on:
  push:
    branches: [ your-branch-name ]
  pull_request:
    branches: [ main ]
    paths:
      - '**'  # allow PRs from your branch into main to run this workflow too

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # stable pick

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install "Django>=4.2,<5.0"
          fi

      # manage.py lives in kosmos_core/
      - name: Run migrations + targeted tests
        working-directory: kosmos_core
        env:
          DJANGO_SETTINGS_MODULE: kosmos_core.settings
        run: |
          python manage.py migrate --noinput
          # Use the exact module path that works locally to avoid discovery hiccups
          python manage.py test apps.appointments.tests.test_booking -v 2
