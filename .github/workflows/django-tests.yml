name: Django CI

on:
  push:
    branches: [ main, master, "**" ]
  pull_request:
    branches: [ main, master, Working-Branch ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install django; fi

      # manage.py is in kosmos_core/
      - name: Run migrations + tests
        working-directory: Kosmobook
        env:
          DJANGO_SETTINGS_MODULE: Kosmobook.settings
        run: |
          python manage.py migrate --noinput
          # Force test discovery by module path (rock-solid):
          python manage.py test users.tests -v 2
