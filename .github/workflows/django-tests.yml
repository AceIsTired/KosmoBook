name: Django CI

on:
  push:
    branches: [ "**" ]       # run on all branches
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # <- use 3.11 (or 3.12/3.13 if all deps support)
          cache: pip               # cache pip packages automatically

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install django
          fi

      # manage.py is inside kosmos_core/
      - name: Run migrations + tests
        working-directory: kosmos_core
        env:
          DJANGO_SETTINGS_MODULE: kosmos_core.settings
        run: |
          python manage.py migrate --noinput
          # force-discover tests using the module path that worked locally
          python manage.py test apps.appointments.tests.test_booking -v 2
